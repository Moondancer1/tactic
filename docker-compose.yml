# VPS deployment: Caddy terminates TLS (Let's Encrypt) for ${DOMAIN}.
#   ./scripts/install.sh   (or: ./scripts/gen-env.sh <domain> <email> && docker compose up -d --build)
name: tactic

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run scripts/gen-env.sh}
      ADMIN_USER: ${ADMIN_USER:-administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - app_data:/data
      - ./apk/out:/app/apk:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  app_data:
  redis_data:
