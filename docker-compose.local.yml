# Local / Home-PC deployment via Docker Desktop + Cloudflare Tunnel.
#   Windows: powershell -ExecutionPolicy Bypass -File scripts\local.ps1
# All secrets come from .env.local (scripts\local.ps1 generates it with random values on first run).
# There are deliberately NO default secrets here: this stack is reachable from the internet through the tunnel.
name: tactic-local

services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run scripts/local.ps1}
      ADMIN_USER: ${ADMIN_USER:-administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set - run scripts/local.ps1}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - ./data:/data
      - ./apk/out:/app/apk:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # Loopback only: players reach the server through the tunnel, never directly over the LAN in clear text.
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/Caddyfile.proxy:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ${TUNNEL_ARGS:-tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://caddy:80}
    depends_on:
      - caddy
