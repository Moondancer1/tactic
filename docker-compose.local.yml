# Local test run on your own PC (Windows/macOS/Linux with Docker Desktop).
#   Windows: powershell -ExecutionPolicy Bypass -File scripts\local.ps1
# A Cloudflare quick tunnel gives a temporary public https://*.trycloudflare.com URL,
# so phones get HTTPS (required for GPS/mic and by the APK) without a domain.
# Voice media goes directly to this PC: phones must be on the same Wi-Fi.
# Secrets below are for local testing only — never use this file on a public server.
name: tactic-local

services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      PUBLIC_URL: http://localhost:8088
      JWT_SECRET: local-only-jwt-secret-0123456789abcdef0123456789abcdef
      ADMIN_TOKEN: local-admin
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: auto
      LIVEKIT_API_KEY: tactic
      LIVEKIT_API_SECRET: local-only-livekit-secret-0123456789abcdef
    volumes:
      - app_data:/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          node_ip: ${LAN_IP:?set LAN_IP to this PC's Wi-Fi/LAN IPv4}
        room:
          auto_create: true
          empty_timeout: 300
        keys:
          tactic: local-only-livekit-secret-0123456789abcdef
    ports:
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy/Caddyfile.proxy:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - livekit

  tunnel:
    image: cloudflare/cloudflared:2025.8.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    depends_on:
      - caddy

volumes:
  app_data:
