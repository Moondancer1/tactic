name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Server smoke test
        run: |
          cd server
          DATA_DIR=$RUNNER_TEMP/data STATIC_DIR=../client/dist node dist/index.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          node test/security-smoke.mjs http://127.0.0.1:3000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
